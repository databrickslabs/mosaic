name: build main
on:
  push:
    branches-ignore:
      - "python/**"
      - "scala/**"
  pull_request:
    branches:
      - "**"
jobs:
  build:
    runs-on: larger
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      matrix:
        python: [ 3.12.3 ]
        numpy: [ 2.1.3 ]
        gdal: [ 3.11.3 ]
        spark: [ 4.0.0 ]
    steps:
      - name: checkout code
        uses: actions/checkout@v2
      - name: build scala
        uses: ./.github/actions/scala_build
      - name: build python
        uses: ./.github/actions/python_build
      - name: build R
        uses: ./.github/actions/r_build
      - name: upload artefacts
        uses: ./.github/actions/upload_artefacts
